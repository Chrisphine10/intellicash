name: Enable SMS sending

# Manual. Sets ENABLE_SMS_NETWORK_CALLS=true in the API's .env and restarts.
#
# That flag is an environment variable only; it cannot be set from the console.
# With it off, every text is recorded QUEUED and nothing leaves the server —
# which is how production went without a single SMS. It does nothing on its own:
# Bonga credentials must also be saved under Dashboard -> Integrations.
#
# Prints the flag line and nothing else from .env, which holds secrets.
on:
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Set the flag and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             ENV=/var/www/intellicash/app/apps/api/.env
             cp -p "$ENV" "$ENV.before-sms-$(date +%Y%m%d-%H%M%S)"
             if grep -q "^ENABLE_SMS_NETWORK_CALLS=" "$ENV"; then
               sed -i "s/^ENABLE_SMS_NETWORK_CALLS=.*/ENABLE_SMS_NETWORK_CALLS=true/" "$ENV"
             else
               echo "ENABLE_SMS_NETWORK_CALLS=true" >> "$ENV"
             fi
             chown intellicash:intellicash "$ENV"
             chmod 600 "$ENV"
             grep "^ENABLE_SMS_NETWORK_CALLS=" "$ENV"
             systemctl restart intellicash
             echo "restarted"'

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            H=$(curl -s --max-time 20 https://intellicash.co.ke/health || echo '')
            echo "attempt $i: $H"
            echo "$H" | grep -q '"status":"ok"' && exit 0
          done
          echo '::error::API did not come back healthy after the restart'
          exit 1

      - name: Report SMS state
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /var/www/intellicash/app/apps/api/prisma/run-with-service-env.sh prisma/diagnose-group-access.ts' | sed -n '/== SMS ==/,/== Onboarded/p'
