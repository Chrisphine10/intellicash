name: CI

# Gate on the things that have actually broken this project before:
# a type error, a failing test, or a web build that only fails on the server.
#
# This workflow covers pull requests. It does NOT gate production: two
# workflows triggered by the same push run independently, so a green run here
# proves nothing about a deploy. deploy-production.yml therefore repeats these
# checks as a `verify` job that its deploy job depends on.

on:
  push:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the VPS (v22.23.1) and the engines range (>=22.12 <26).
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate -w @intellicash/api

      - name: Typecheck
        run: npm run typecheck

      # Production is built by `prisma migrate deploy`, the tests by `db push`.
      # Nothing proved the two agree: a schema change without its migration
      # passed CI and failed (or silently drifted) on the live database. Build
      # a database from the migrations alone and require it to equal the schema.
      - name: Migrations build the schema
        working-directory: apps/api
        run: |
          rm -f prisma/ci-migrate.db
          DATABASE_URL=file:./ci-migrate.db npx prisma migrate deploy --schema prisma/schema.prisma
          DATABASE_URL=file:./ci-migrate.db npx prisma migrate diff \
            --from-url file:./prisma/ci-migrate.db \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          rm -f prisma/ci-migrate.db

      # The api suite runs against apps/api/prisma/dev.db and each test file
      # reseeds it, but nothing creates it. A developer machine already has one
      # from `npm run dev`, so this only ever fails on a clean checkout — which
      # is exactly what CI is.
      - name: Prepare test database
        run: |
          npm run db:push -w @intellicash/api
          npm run db:seed -w @intellicash/api

      - name: Test
        run: npm run test

      - name: Build web
        env:
          # Single-process topology: the API is served by the same origin,
          # so this must stay relative. An absolute localhost URL here is
          # what ships a build whose browser calls all fail.
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build -w @intellicash/web
